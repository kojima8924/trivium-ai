    - id: code_search_out
      type: custom
      data:
        title: 検索結果の抽出
        type: code
        desc: 本文と出典 URL を取り出す。失敗・非 200 なら空文字（会話は止めない）
        selected: false
        code_language: python3
        code: |
          import json


          def main(body, status_code) -> dict:
              try:
                  data = json.loads(body) if isinstance(body, str) else (body or {})
                  if not isinstance(data, dict):
                      data = {}
              except Exception:
                  return {"research": "", "sources": ""}
              try:
                  if int(status_code) != 200:
                      return {"research": "", "sources": ""}
              except Exception:
                  return {"research": "", "sources": ""}
              texts = []
              urls = []
              for item in data.get("output", []) or []:
                  if item.get("type") != "message":
                      continue
                  for c in item.get("content", []) or []:
                      if c.get("type") == "output_text":
                          if c.get("text"):
                              texts.append(c["text"])
                          for a in c.get("annotations", []) or []:
                              if a.get("url"):
                                  urls.append(a["url"])
              if not texts and data.get("output_text"):
                  texts.append(str(data["output_text"]))
              research = "\n".join(t for t in texts if t).strip()[:4000]
              uniq = list(dict.fromkeys(urls))[:6]
              return {"research": research, "sources": "\n".join("- " + u for u in uniq) if uniq else ""}
        variables:
        - variable: body
          value_selector:
          - http_search
          - body
        - variable: status_code
          value_selector:
          - http_search
          - status_code
        outputs:
          research:
            type: string
            children: null
          sources:
            type: string
            children: null
