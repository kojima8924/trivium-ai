  conversation_variables:
  - id: trivium-conv-last-agent
    name: last_agent
    value_type: string
    value: ''
    description: いま話す担当（READ / WRITE / CODE / LEADER）。会話に残るので、担当をまたいでも文脈が続く
    selector:
    - conversation
    - last_agent
  environment_variables:
  - id: trivium-env-api-base
    name: TRIVIUM_API_BASE
    value: https://trivium.example.com
    value_type: string
    selector:
    - env
    - TRIVIUM_API_BASE
    description: Trivium アプリの公開 URL。/api/agent/context を呼ぶ。インポート後に実際の URL へ差し替える
  - id: trivium-env-agent-token
    name: TRIVIUM_AGENT_TOKEN
    value: REPLACE_ME
    value_type: secret
    selector:
    - env
    - TRIVIUM_AGENT_TOKEN
    description: アプリ側の AGENT_API_TOKEN と同じ値。/api/agent/context の Bearer トークン
  rag_pipeline_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      number_limits: 0
      image:
        enabled: false
        number_limits: 0
        transfer_methods: []
    opening_statement: こんにちは。Trivium の案内役、ミチよ。読解（ヨミ）・作文（フミ）・論理（ロゴス）の担当にも、名前で呼べば代わるわ。何から話す？
