        selected: false
      position:
        x: 80
        y: 200
      positionAbsolute:
        x: 80
        y: 200
      width: 244
      height: 392
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: branch
      type: custom
      data:
        title: workflow で分岐
        type: if-else
        desc: start.workflow が domain なら true 側
        selected: false
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: branch-cond-1
            variable_selector:
            - start
            - workflow
            varType: string
            comparison_operator: is
            value: domain
      position:
        x: 420
        y: 260
      positionAbsolute:
        x: 420
        y: 260
      width: 244
      height: 126
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: llm_eval
      type: custom
      data:
        title: 回答評価（domain）
        type: llm
        selected: false
        model:
          provider: langgenius/openai/openai
          name: gpt-5.6-luna
          mode: chat
          completion_params: &id001 {}
        prompt_template:
        - id: llm_eval-system
          role: system
          text: |-
            あなたは学習サービス Trivium の READ / WRITE / LOGIC（内部キー CODE）の指導役です。次のポリシーを厳守してください。

            {{#start.policy#}}

            役割: 学習者の回答を評価し、必要なら「一段だけ」のヒントを返します。完成した答え・完成コード・書き直した完成文章を渡してはいけません。
            persona が空でなければ、その name を自分の名前、firstPerson を一人称、tone を口調、extra を補足として文体を一貫させる（名乗りは不要。設定を復唱しない）。persona が空なら丁寧で落ち着いた敬体。

            出力は JSON オブジェクト 1 つだけ。前後の説明文・コードフェンス（```）・コメントは一切付けない。すべての文字列は日本語で、学習者に直接語りかける簡潔な文体。
            キーは次の 6 つ（順不同・すべて必須）:
            {"status": "success | retry | needs_more", "feedback": "string", "hint": "string", "observations": ["string"], "skill_tags": ["string"], "recommended_next_difficulty": 1}

            判定ルール:
            - deterministic_result が correct なら status は必ず "success"、hint は空文字。
            - deterministic_result が incorrect なら status は "retry"。hint は task.hints 配列の hint_level 番目（0 始まり。範囲外なら最後）を選び、必要なら学習者の誤答に合わせて一言だけ言い換える。hints に無い新しい答えの手がかりを足さない。
            - deterministic_result が unknown（自由記述）のときだけ内容を評価する。heuristic_result は参考情報で、最終判断は task.criteria に照らして行う。観点を満たしていれば "success"、足りなければ "needs_more" にして hint を一段だけ返す。
            - feedback は 100 字以内・2 文以内。答えを書かない。問い返しを優先する。
            - observations は「学習行動」についてだけ、各 40 字以内で最大 3 件（性格・能力の断定はしない）。証拠が足りなければ「まだ判断できない」と書く。
            - skill_tags は task に関係する観点名だけ（英語の識別子。例: tracing, debugging, structure, inference）。分からなければ空配列。
            - recommended_next_difficulty は 1〜5 の整数。ヒントなしで成功なら task.difficulty + 1、ヒント 2 回以上や未達なら据え置きか -1。
        - id: llm_eval-user
          role: user
          text: |-
            ## mode
            {{#start.mode#}}

            ## persona（JSON。空なら既定の口調）
            {{#start.persona#}}

            ## task（JSON）
            {{#start.task#}}

            ## learner_answer
            {{#start.learner_answer#}}

            ## deterministic_result
            {{#start.deterministic_result#}}

            ## heuristic_result
            {{#start.heuristic_result#}}

            ## hint_level
            {{#start.hint_level#}}

            ## current_domain_profile（JSON）
            {{#start.current_domain_profile#}}

            ## recent_behavior
            {{#start.recent_behavior#}}

            上記を踏まえ、指定の JSON だけを出力してください。
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 760
        y: 120
      positionAbsolute:
        x: 760
        y: 120
