      type: custom
      data:
        title: 開始
        type: start
        variables:
        - variable: workflow
          label: 呼び出し種別（domain / interpret）
          type: text-input
          required: true
          options: []
          max_length: 256
        - variable: mode
          label: read / write / code
          type: text-input
          required: true
          options: []
          max_length: 256
        - variable: policy
          label: システムポリシー 7 箇条
          type: paragraph
          required: true
          options: []
          max_length: 48000
        - variable: persona
          label: AI の人格 JSON（name, tone, firstPerson, extra。無ければ空）
          type: paragraph
          required: false
          options: []
          max_length: 48000
        - variable: task
          label: 課題 JSON（domain 用）
          type: paragraph
          required: false
          options: []
          max_length: 48000
        - variable: learner_answer
          label: 学習者の回答（domain 用）
          type: paragraph
