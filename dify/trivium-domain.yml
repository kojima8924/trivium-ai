app:
  name: trivium-domain
  description: 'Trivium: READ/WRITE/LOGIC の回答評価（一段ヒント）と domain 寸評。workflow=domain|interpret で分岐。出力は result（JSON 文字列）。'
  mode: workflow
  icon: 📐
  icon_type: emoji
  icon_background: '#EFF1F5'
  use_icon_as_answer_icon: false
dependencies:
- type: marketplace
  current_identifier: null
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:1.0.1@b513bf843af4619450bdc15f32e995f90ebdeee143b1cccef442a867099b3397
    version: null
