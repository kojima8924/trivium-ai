        - variable: current_domain_profile
          label: domain profile JSON（domain 用）
          type: paragraph
          required: false
          options: []
          max_length: 48000
        - variable: recent_behavior
          label: 直近の学習行動（改行区切り、domain 用）
          type: paragraph
          required: false
          options: []
          max_length: 48000
        - variable: stats
          label: 集計値 JSON（interpret 用）
          type: paragraph
          required: false
          options: []
          max_length: 48000
        - variable: recent_events
          label: 直近イベント JSON（interpret 用）
          type: paragraph
          required: false
