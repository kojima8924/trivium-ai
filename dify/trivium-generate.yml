    - id: parse_search
      type: custom
      data:
        title: 検索結果の要約抽出
        type: code
        desc: output_text と url_citation を research 文字列にまとめる（失敗時は空）
        selected: false
        code_language: python3
        code: |
          import json

          def main(body: str, status_code: int) -> dict:
              """Responses API の応答から本文と引用 URL を取り出し、作問 LLM に渡す research 文字列にする。"""
              try:
                  data = json.loads(body) if isinstance(body, str) else (body or {})
              except Exception:
                  return {"research": ""}
              try:
                  if int(status_code) != 200:
                      return {"research": ""}
              except Exception:
                  return {"research": ""}
              texts = []
              urls = []
              for item in data.get("output", []) or []:
                  if item.get("type") != "message":
                      continue
                  for c in item.get("content", []) or []:
                      if c.get("type") == "output_text":
                          texts.append(c.get("text", "") or "")
                          for a in c.get("annotations", []) or []:
                              if a.get("type") == "url_citation" and a.get("url"):
                                  urls.append(a["url"])
              research = "\n".join(t for t in texts if t).strip()
              if urls:
                  uniq = list(dict.fromkeys(urls))[:3]
                  research = research + "\n出典: " + " ".join(uniq)
              return {"research": research[:6000]}
        variables:
        - variable: body
          value_selector:
          - search
          - body
        - variable: status_code
          value_selector:
          - search
          - status_code
        outputs:
          research:
            type: string
            children: null
      position:
