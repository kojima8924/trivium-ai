      type: custom
      data:
        title: 検索リクエスト組立
        type: code
        desc: 依頼文から OpenAI Responses API（web_search）の本文を作る
        selected: false
        code_language: python3
        code: |
          import json

          def main(request: str, domain: str) -> dict:
              """OpenAI Responses API + web_search で、依頼に合う一般向けの最近の話題を集めるリクエスト本文を組み立てる。"""
              q = (request or "").strip()[:200]
              ask = (
                  "次の依頼に合う、最近の一般向けニュース・話題を日本語で 3 件、各 2 文で要約してください。"
                  "各件の末尾に出典 URL を 1 つ付けてください。医療・法律・宗教・個人に関する内容、"
                  "未確認の噂は避け、学習教材の題材として使える事実だけにしてください。"
                  f"\n依頼: {q}\n領域: {domain}"
              )
              body = {
                  "model": "gpt-5.4-mini",
                  "tools": [{"type": "web_search"}],
                  "input": ask,
              }
              return {"body": json.dumps(body, ensure_ascii=False)}
        variables:
        - variable: request
          value_selector:
          - start
          - request
        - variable: domain
          value_selector:
          - start
          - domain
        outputs:
          body:
            type: string
            children: null
      position:
